services:
  app:
    image: app:latest
    restart: always
    cap_add: [NET_ADMIN]
    profiles: [debug]
    platform: linux/arm64
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
    privileged: true
    ports:
      - "3000"
    volumes:
      - appdata:/data
    labels:
      - role=app
    typo_key: 1

volumes:
  appdata: {}
