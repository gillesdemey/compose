services:
  app:
    image: app:latest
    restart: always
    cap_add: [NET_ADMIN]
    profiles: [debug]
    platform: linux/arm64
    ulimits:
      nofile: 1024
    privileged: true
    ports:
      - "3000"
    volumes:
      - appdata:/data
    labels:
      - role=app
    typo_key: 1

volumes:
  appdata: {}
